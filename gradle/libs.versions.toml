# MTRP SDK — Version Catalog
# All versions here. Never hardcode versions anywhere else.

[versions]
kotlin                = "2.1.0"
agp                   = "8.5.2"
ksp                   = "2.1.0-1.0.29"
compose-multiplatform = "1.8.0"
androidx-activity     = "1.9.3"
coroutines            = "1.9.0"
sqldelight            = "2.0.2"
serialization         = "1.7.3"
ktor                  = "3.0.1"
koin                  = "4.0.0"
voyager               = "1.1.0-beta03"
kotest                = "5.9.1"
turbine               = "1.2.0"
mockk                 = "1.13.13"
datetime              = "0.6.1"
settings              = "1.3.0"

[libraries]
kotlin-stdlib         = { module = "org.jetbrains.kotlin:kotlin-stdlib",                  version.ref = "kotlin" }
kotlin-test           = { module = "org.jetbrains.kotlin:kotlin-test",                     version.ref = "kotlin" }
coroutines-core       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",         version.ref = "coroutines" }
coroutines-android    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",      version.ref = "coroutines" }
coroutines-test       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",         version.ref = "coroutines" }
serialization-json    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",      version.ref = "serialization" }
serialization-proto   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf",  version.ref = "serialization" }
datetime              = { module = "org.jetbrains.kotlinx:kotlinx-datetime",                version.ref = "datetime" }
sqldelight-android    = { module = "app.cash.sqldelight:android-driver",                    version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions",             version.ref = "sqldelight" }
sqldelight-test       = { module = "app.cash.sqldelight:sqlite-driver",                     version.ref = "sqldelight" }
ktor-client-core      = { module = "io.ktor:ktor-client-core",                              version.ref = "ktor" }
ktor-client-okhttp    = { module = "io.ktor:ktor-client-okhttp",                            version.ref = "ktor" }
ktor-client-ws        = { module = "io.ktor:ktor-client-websockets",                        version.ref = "ktor" }
ktor-client-logging   = { module = "io.ktor:ktor-client-logging",                          version.ref = "ktor" }
ktor-serialization    = { module = "io.ktor:ktor-serialization-kotlinx-json",              version.ref = "ktor" }
koin-core             = { module = "io.insert-koin:koin-core",                              version.ref = "koin" }
koin-android          = { module = "io.insert-koin:koin-android",                           version.ref = "koin" }
koin-compose          = { module = "io.insert-koin:koin-compose",                           version.ref = "koin" }
koin-test             = { module = "io.insert-koin:koin-test",                              version.ref = "koin" }
voyager-navigator     = { module = "cafe.adriel.voyager:voyager-navigator",                 version.ref = "voyager" }
voyager-screenmodel   = { module = "cafe.adriel.voyager:voyager-screenmodel",               version.ref = "voyager" }
voyager-koin          = { module = "cafe.adriel.voyager:voyager-koin",                      version.ref = "voyager" }
kotest-framework      = { module = "io.kotest:kotest-framework-engine",                     version.ref = "kotest" }
kotest-assertions     = { module = "io.kotest:kotest-assertions-core",                      version.ref = "kotest" }
turbine               = { module = "app.cash.turbine:turbine",                              version.ref = "turbine" }
mockk                 = { module = "io.mockk:mockk",                                        version.ref = "mockk" }
settings              = { module = "com.russhwolf:multiplatform-settings",                  version.ref = "settings" }
settings-coroutines   = { module = "com.russhwolf:multiplatform-settings-coroutines",       version.ref = "settings" }
androidx-activity     = { module = "androidx.activity:activity-compose",                   version.ref = "androidx-activity" }

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                      version.ref = "compose-multiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
android-application   = { id = "com.android.application",                    version.ref = "agp" }
android-library       = { id = "com.android.library",                         version.ref = "agp" }
sqldelight            = { id = "app.cash.sqldelight",                          version.ref = "sqldelight" }
ksp                   = { id = "com.google.devtools.ksp",                       version.ref = "ksp" }
